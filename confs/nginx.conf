events { }

http {
    server {
        listen 80;
        listen 443 ssl;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_ciphers                 ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers   on;

        location / {
            proxy_pass http://upstream:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS front for mcp-server, selected by name so the default server above is unchanged.
    # The MCP OAuth broker refuses plain-HTTP upstreams that are not loopback.
    server {
        listen 443 ssl;
        server_name mcp-tls;

        ssl_certificate /etc/nginx/ssl/mcp-tls.crt;
        ssl_certificate_key /etc/nginx/ssl/mcp-tls.key;

        # Resolve at request time so nginx still starts when mcp-server is not running.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream http://mcp-server:7878;

        location / {
            proxy_pass $mcp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            # MCP responses may stream (SSE).
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}